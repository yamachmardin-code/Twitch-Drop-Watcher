name: Build Drop Watcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project ZIP
        run: |
          test -f android-project.zip
          unzip -t android-project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q android-project.zip -d android-build
          test -f android-build/settings.gradle
          test -f android-build/app/build.gradle

      - name: Build debug APK
        working-directory: android-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          test -f android-build/app/build/outputs/apk/debug/app-debug.apk
          cp android-build/app/build/outputs/apk/debug/app-debug.apk Twitch-Drop-Watcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-Drop-Watcher-APK
          path: Twitch-Drop-Watcher.apk
          if-no-files-found: error
          retention-days: 7
